[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mint-synth"
version = "2.0.0"
description = "Production, provenance-first financial data synthesis for SLURM clusters"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = {text = "MIT"}
authors = [{name = "Mint synthesis reproduction"}]
dependencies = [
  "PyYAML>=6.0.2,<7",
  "jsonschema>=4.23,<5",
  "pyarrow>=18,<24",
  "duckdb>=1.2,<2",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
mint-synth = "mint_synth.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mint_synth = ["resources/*.yaml", "resources/*.json"]
