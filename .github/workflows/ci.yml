name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked direct dependencies
        run: |
          python -m pip install --constraint constraints.txt setuptools wheel
          python -m pip install --no-build-isolation --constraint constraints.txt -e '.[dev]'
      - name: Compile
        run: python -m compileall -q src tests
      - name: Unit and Parquet integration tests
        run: python -m unittest discover -s tests -v
      - name: Validate JSON schema syntax
        run: python -m json.tool src/mint_synth/resources/config-v2.schema.json >/dev/null

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build --tag mint-synth:${{ github.sha }} .
